name: Fetch Substack Feed

on:
  schedule:
    # Runs every day at 6am UTC — picks up any new articles automatically
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch and Parse Substack RSS Feed
        run: |
          python3 - <<'EOF'
          import urllib.request, re, feedparser, json

          # 1. Fetch raw RSS bytes
          req = urllib.request.Request(
              'https://beatingsisyphus.substack.com/feed',
              headers={'User-Agent': 'Mozilla/5.0'}
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read().decode('utf-8', errors='replace')

          # 2. Strip invalid XML 1.0 characters (the root cause of the parse error)
          #    Valid XML chars: #x9 | #xA | #xD | [#x20-#xD7FF] | [#xE000-#xFFFD]
          clean = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f\ufffe\uffff]', '', raw)

          print(f"Raw size: {len(raw)} | Cleaned size: {len(clean)}")

          # 3. Parse the cleaned XML string with feedparser
          feed = feedparser.parse(clean)
          print(f"Bozo: {feed.bozo} | Entries: {len(feed.entries)}")

          if not feed.entries:
              raise RuntimeError(f"No entries parsed. Bozo exception: {feed.bozo_exception}")

          # 4. Build JSON
          articles = []
          for entry in feed.entries:
              articles.append({
                  'title':       entry.get('title', '').strip(),
                  'link':        entry.get('link', '').strip(),
                  'pubDate':     entry.get('published', '').strip(),
                  'description': entry.get('summary', '').strip(),
                  'author':      entry.get('author', '').strip(),
              })

          out = {'status': 'ok', 'items': articles}
          with open('public/substack-feed.json', 'w') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print(f"Wrote {len(articles)} articles:")
          for a in articles:
              print(f"  - {a['title'][:70]}")
          EOF

      - name: Commit Feed JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/substack-feed.json
          git diff --staged --quiet || git commit -m "chore: refresh Substack feed [skip ci]"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: npx gh-pages -d dist -u "github-actions-bot <support+actions@github.com>" -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
