name: Fetch Substack Feed

on:
  schedule:
    # Runs every day at 6am UTC — picks up any new articles automatically
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Substack RSS Feed
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Cache-Control: no-cache" \
            --retry 3 --retry-delay 5 \
            "https://beatingsisyphus.substack.com/feed" \
            -o /tmp/feed.xml
          echo "Downloaded $(wc -c < /tmp/feed.xml) bytes"
          head -c 200 /tmp/feed.xml

      - name: Install feedparser
        run: pip install feedparser

      - name: Parse Feed and Write JSON
        run: |
          python3 - <<'EOF'
          import re, feedparser, json

          # Read the file curl downloaded
          with open('/tmp/feed.xml', 'r', encoding='utf-8', errors='replace') as f:
              raw = f.read()

          # Strip invalid XML 1.0 control characters
          clean = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f\ufffe\uffff]', '', raw)
          print(f"Raw: {len(raw)} bytes → Cleaned: {len(clean)} bytes")

          feed = feedparser.parse(clean)
          print(f"Bozo: {feed.bozo} | Entries: {len(feed.entries)}")

          if not feed.entries:
              raise RuntimeError(f"No entries parsed. Bozo: {feed.bozo_exception}")

          articles = []
          for entry in feed.entries:
              articles.append({
                  'title':       entry.get('title', '').strip(),
                  'link':        entry.get('link', '').strip(),
                  'pubDate':     entry.get('published', '').strip(),
                  'description': entry.get('summary', '').strip(),
                  'author':      entry.get('author', '').strip(),
              })

          out = {'status': 'ok', 'items': articles}
          with open('public/substack-feed.json', 'w') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print(f"Wrote {len(articles)} articles:")
          for a in articles:
              print(f"  - {a['title'][:70]}")
          EOF

      - name: Commit Feed JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/substack-feed.json
          git diff --staged --quiet || git commit -m "chore: refresh Substack feed [skip ci]"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: npx gh-pages -d dist -u "github-actions-bot <support+actions@github.com>" -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
